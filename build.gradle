plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mailengine'
version = '0.0.1-SNAPSHOT'
description = 'mailengine'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ── Core (Ope's) ────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // .csv & .xlsx parsing
    implementation 'com.opencsv:opencsv:5.9'
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    // ── Email sending via SES SMTP (Ope's) ─
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // ── Database ─────────────────────────────────────────────────────
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // ── Auth ─────────────────────────────────────────────────────────
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ── API Docs ──────────────────────────────────────────────────────
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // ── Lombok ────────────────────────────────────────────────────────
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── Dev Tools ─────────────────────────────────────────────────────
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // ── Ahmed's ADDITIONS (BE-3 & BE-4) ─────────────────────────────────

    // Rate limiting — controls how fast the worker sends emails to SES (BE-3)
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // GeoIP — converts an IP address to country + city on open/click events (BE-4)
    implementation 'com.maxmind.geoip2:geoip2:4.2.0'

    // User-Agent parsing — detects device type, email client, OS from request headers (BE-4)
    implementation 'nl.basjes.parse.useragent:yauaa:7.28.1'

    // Caching — prevents repeated DB hits for analytics queries (BE-4)
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    //env - creates and stores the .env file created
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // ── Test ──────────────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}