spring:
  application:
    name: mailengine

  # Core Database Config (Production/Default)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Database Migration
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Mail via SES SMTP in production, MailHog locally
  # Production: set MAIL_HOST=email-smtp.us-east-1.amazonaws.com, MAIL_PORT=587,
  #             MAIL_USERNAME=<SES SMTP user>, MAIL_PASSWORD=<SES SMTP pass>
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  # File Upload Limits
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Async Executor Settings
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 500


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${S3_BUCKET_NAME}
    cdn-base-url: ${S3_CDN_URL}

app:
  mail:
    from: ${MAIL_FROM:noreply@mailengine.app}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    # Comma-separated list of allowed frontend origins.
    # Example: https://myapp.up.railway.app,https://myapp.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://mailengine-production-11eb.up.railway.app/, https://mailengine-production-11eb.up.railway.app/swagger-ui/index.html#/}

logging:
  level:
    root: INFO
    com.mailengine: DEBUG
    org.springframework: WARN