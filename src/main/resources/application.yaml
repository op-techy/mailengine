spring:
  application:
    name: mailengine

  # Core Database Config (Production/Default)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Database Migration
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

  # File Upload Limits
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Async Executor Settings
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 500

# Custom Application Properties
jwt:
  secret: ${JWT_SECRET:CHANGE_ME_USE_A_LONG_RANDOM_BASE64_STRING_AT_LEAST_64_CHARS}
  expiration: ${JWT_EXPIRATION:86400000}

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${S3_BUCKET_NAME:mailengine-assets-2026}
    cdn-base-url: ${S3_CDN_URL:https://mailengine-assets-2026.s3.amazonaws.com}

app:
  mail:
    from: noreply@mailengine.app
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    org.springframework.security: DEBUG

